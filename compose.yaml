# Manifest scanned by Aiven Runtime.
#
# Runtime detects two things here:
#   1. `kafbat-ui`: the application to build from the repository's Dockerfile.
#   2. `kafka-broker`: a recognised Kafka image, so Runtime offers to create an
#      Aiven for Apache Kafka service. During the scan, click
#      "Swap with an existing service" to point at your existing service instead.
#
# The integration automatically injects KAFKA_BOOTSTRAP_SERVERS,
# KAFKA_SECURITY_PROTOCOL, KAFKA_ACCESS_KEY, KAFKA_ACCESS_CERT and KAFKA_CA_CERT.
# Only KAFKA_CA_CERT is actually useful to us (building the truststore): the SASL
# bootstrap address and the SCRAM credentials are supplied separately, as Runtime
# variables and secrets (see README).
#
# MULTI-CLUSTER: this file wires cluster 0 through the single-cluster shorthand.
# Additional clusters are declared entirely with KAFKA_1_*, KAFKA_2_*, ...
# variables added in the Runtime UI — no change to this file is needed, since
# Runtime can only integrate one Kafka service per application anyway. See the
# "Several clusters in one UI" section of the README.

services:
  kafbat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka-broker
    environment:
      # --- Kafka cluster 0 -------------------------------------------------
      # The integration owns KAFKA_BOOTSTRAP_SERVERS, KAFKA_CA_CERT,
      # KAFKA_ACCESS_* and KAFKA_SECURITY_PROTOCOL, and keeps those names in the
      # Runtime UI. The entrypoint maps them onto cluster 0, so the CA is taken
      # care of. Everything you set yourself uses the INDEXED names, which take
      # priority and never clash with an integration-managed key.
      #
      # Careful: the integration's bootstrap address is the service's mTLS port.
      # SASL_SSL needs the SASL one (Console > Overview > Connection information
      # > SASL), which is why it is set here as KAFKA_0_BOOTSTRAP_SERVERS.
      KAFKA_0_NAME: ${KAFKA_0_NAME:-aiven-kafka}
      KAFKA_0_BOOTSTRAP_SERVERS: ${KAFKA_0_BOOTSTRAP_SERVERS}
      KAFKA_0_SASL_MECHANISM: ${KAFKA_0_SASL_MECHANISM:-SCRAM-SHA-512}
      KAFKA_0_SASL_USERNAME: ${KAFKA_0_SASL_USERNAME}
      KAFKA_0_SASL_PASSWORD: ${KAFKA_0_SASL_PASSWORD}
      # Only needed without an integration (otherwise KAFKA_CA_CERT covers it).
      KAFKA_0_CA_CERT: ${KAFKA_0_CA_CERT:-}

      # --- Schema Registry (Karapace) --------------------------------------
      KAFKA_0_SCHEMA_REGISTRY_URL: ${KAFKA_0_SCHEMA_REGISTRY_URL}
      KAFKA_0_SCHEMA_REGISTRY_USER: ${KAFKA_0_SCHEMA_REGISTRY_USER}
      KAFKA_0_SCHEMA_REGISTRY_PASSWORD: ${KAFKA_0_SCHEMA_REGISTRY_PASSWORD}
      # Note: DEFAULTVALUESERDE is deliberately NOT set here. The entrypoint
      # sets it to SchemaRegistry only if a registry URL is present for that
      # cluster — otherwise Kafbat cannot resolve the serde and refuses to start.

      # --- UI access control -----------------------------------------------
      # The Runtime URL is public and Kafbat has no auth by default. Set these
      # two as a Runtime variable + secret for a single login, or set
      # AUTH_TYPE=OAUTH2 with your provider's client config for OAuth2 + RBAC.
      # With neither, the entrypoint forces every cluster read-only.
      UI_AUTH_USERNAME: ${UI_AUTH_USERNAME:-}
      UI_AUTH_PASSWORD: ${UI_AUTH_PASSWORD:-}

      # --- UI behaviour ----------------------------------------------------
      KAFKA_0_READONLY: ${KAFKA_0_READONLY:-true}
      DYNAMIC_CONFIG_ENABLED: "false"
      SERVER_PORT: "8080"
      LOGGING_LEVEL_IO_KAFBAT_UI: INFO

  # Detected as an Aiven for Apache Kafka service: replace it with your existing
  # service during the scan ("Swap with an existing service").
  kafka-broker:
    image: apache/kafka:3.9
