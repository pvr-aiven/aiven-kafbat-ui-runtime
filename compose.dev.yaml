# Local run against real Kafka clusters.
#
#   cp .env.example .env   # then fill it in, or: ./scripts/aiven-env.sh <project> <service>
#   docker compose -f compose.dev.yaml up --build
#   open http://localhost:8080
#
# No local broker: this validates exactly the configuration that will ship to
# Runtime. Everything, including extra clusters (KAFKA_1_*, KAFKA_2_*, ...),
# comes from .env — add them there and they show up in the UI.

services:
  kafbat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafbat-ui-aiven
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      LOGGING_LEVEL_IO_KAFBAT_UI: DEBUG
      # Locally the CAs are mounted as files rather than pasted into .env.
      # One file per cluster that needs a private CA:
      #   KAFKA_0_CA_CERT_FILE=/certs/ca-0.pem, KAFKA_1_CA_CERT_FILE=...
      AIVEN_CA_CERT_FILE: /certs/ca.pem
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
